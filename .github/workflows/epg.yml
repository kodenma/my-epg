name: Auto Update Japan EPG

on:
  schedule:
    # 毎日 日本時間 午前5:00 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and prepare Custom Japan EPG
        run: |
          mkdir -p public

          # Custom_JP1.xml と完全同一のID体系を持つ本家ソースから直接取得
          EPG_URL="https://animenosekai.github.io/japanterebi-xmltv/guide.xml"

          echo "Downloading EPG from ${EPG_URL}..."
          curl -f -s -L -A "Mozilla/5.0" "${EPG_URL}" -o public/epg.xml

          # TiviMate 用に gzip 圧縮版も同時に生成
          echo "Compressing epg.xml.gz..."
          gzip -k -f public/epg.xml

          # 生成ファイルの確認
          ls -lh public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
