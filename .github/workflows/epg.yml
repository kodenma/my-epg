name: Generate EPG

on:
  schedule:
    # 毎日日本時間 午前4:00 (UTC 19:00) に自動実行
    - cron: '0 19 * * *'
  # 手動実行ボタンを有効化
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Create output directory
        run: mkdir -p public

      - name: Run EPG Grabber
        run: npm run grab

      - name: Compress EPG XML
        run: |
          gzip -k -f public/epg.xml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
