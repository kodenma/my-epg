name: Auto Update Japan EPG

on:
  schedule:
    # 毎日 日本時間 午前5:00 (UTC 20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download, Filter, and Prepare Custom EPG
        run: |
          mkdir -p public

          # 1. 安定ソースから元データをダウンロード
          echo "Downloading source EPG..."
          curl -f -s -L -A "Mozilla/5.0" "https://epg.pw/xmltv/epg_JP.xml.gz" -o public/raw_epg.xml.gz
          gunzip -f public/raw_epg.xml.gz

          # 2. Custom_JP1.xml 向けにID・局名を自動変換
          python filter_epg.py

          # 3. 一時元ファイルを削除し、完成版をgzip圧縮
          rm -f public/raw_epg.xml
          gzip -k -f public/epg.xml

          # 結果確認
          ls -lh public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
