name: Auto Update Japan EPG

on:
  schedule:
    # 毎日 日本時間 午前5:00（UTC 20:00）に自動更新
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and prepare EPG with fallback
        run: |
          mkdir -p public

          # 信頼性の高い日本向けEPGソース（優先順位順）
          SOURCES=(
            "https://epg.pw/xmltv/epg_JP.xml.gz"
            "https://animenosekai.github.io/japanterebi-xmltv/guide.xml"
            "https://raw.githubusercontent.com/karenda-jp/etc/main/guides.xml"
          )

          SUCCESS=0
          for url in "${SOURCES[@]}"; do
            echo "----------------------------------------"
            echo "Attempting to download from: ${url}"
            
            if [[ "$url" == *.gz ]]; then
              if curl -f -s -L -A "Mozilla/5.0" "$url" -o public/epg.xml.gz; then
                echo "Download succeeded. Decompressing..."
                gunzip -k -f public/epg.xml.gz
                SUCCESS=1
                break
              fi
            else
              if curl -f -s -L -A "Mozilla/5.0" "$url" -o public/epg.xml; then
                echo "Download succeeded. Compressing..."
                gzip -k -f public/epg.xml
                SUCCESS=1
                break
              fi
            fi
            echo "Failed to fetch from ${url}. Trying next source..."
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "Error: All EPG sources failed."
            exit 1
          fi

          echo "----------------------------------------"
          echo "EPG files successfully created:"
          ls -lh public/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
