name: Sync and Convert EPG

on:
  schedule:
    - cron: '0 18 * * *'  # 日本時間 午前3:00（UTC 18:00）に毎日自動実行
  workflow_dispatch:       # GitHub画面からの手動実行を有効化

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # リポジトリ更新に必要な書き込み権限
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Conversion Script
        run: python convert_epg.py

      - name: Commit and Push Converted File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add converted_guides.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update converted EPG [skip ci]" && git push)
